    .back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    @keyframes mode-pulse { 50% { transform: translateY(-3px); opacity: .72; } }
    @media (hover:hover) {

      .result-card:hover { transform: translateY(-3px); border-color: var(--hlp-primary-300); box-shadow: 0 13px 30px rgba(30,26,22,.065); }
    }

      .filter-options { max-height: none; }

    @media (max-width: 560px) {

    @media (prefers-reduced-motion: reduce) {

  <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部"><i data-lucide="arrow-up" aria-hidden="true"></i></button>

  <script>
    (function () {
      'use strict';
      var poemsObject = window.HL_POEMS || {};
      var poems = Object.keys(poemsObject).map(function (id) {
        var poem = poemsObject[id] || {};
        return Object.assign({ id: id }, poem, { chapterNumber: chapterNumber(poem.chapter || '') });
      });
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var form = document.getElementById('search-form');
      var input = document.getElementById('q');
      var results = document.getElementById('results');
      var resultCount = document.getElementById('result-count');
      var backToTop = document.getElementById('back-to-top');
      var debounceTimer = 0;
      var state = { q: '', author: '', chapter: '', genre: '', sort: 'relevance', mode: '' };
      var people = ['黛玉','宝钗','宝玉','湘云','探春','元春','迎春','惜春','宝琴','香菱','李纨','邢岫烟','贾环','贾兰','妙玉','警幻仙子','甄士隐','曹雪芹','癞头和尚','贾雨村'];
      var genres = ['诗','词','曲','判词','酒令','灯谜'];

      function safeIcons() {
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 18, height: 18, 'stroke-width': 1.6 } });
      }
      function chapterNumber(value) {
        var digit = String(value).match(/\d+/);
        if (digit) return Number(digit[0]);
        var source = String(value).replace(/[第回]/g, '');
        var digits = { '零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
        var total = 0, current = 0;
        for (var i = 0; i < source.length; i++) {
          var ch = source[i];
          if (Object.prototype.hasOwnProperty.call(digits, ch)) current = digits[ch];
          else if (ch === '十') { total += (current || 1) * 10; current = 0; }
          else if (ch === '百') { total += (current || 1) * 100; current = 0; }
        }
        return total + current;
      }
      function genreOf(type) {
        type = String(type || '');
        if (type.indexOf('判词') >= 0) return '判词';
        if (type.indexOf('酒令') >= 0) return '酒令';
        if (type.indexOf('灯谜') >= 0) return '灯谜';
        if (type === '词' || /词$/.test(type)) return '词';
        if (type.indexOf('曲') >= 0) return '曲';
        if (/律|绝|诗|歌行|古风|联句/.test(type)) return '诗';
        return type;
      }
      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[char];
        });
      }
      function escapeRegExp(value) { return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function highlight(value, query) {
        var safe = escapeHtml(value);
        var terms = String(query || '').trim().split(/\s+/).filter(Boolean).sort(function (a,b) { return b.length - a.length; });
        if (!terms.length) return safe;
        var pattern = terms.map(function (term) { return escapeRegExp(escapeHtml(term)); }).join('|');
        if (!pattern) return safe;
        return safe.replace(new RegExp('(' + pattern + ')', 'gi'), '<mark>$1</mark>');
      }
      function searchable(poem) {
        return [poem.title, poem.author, poem.chapter, poem.chapterNumber, poem.type].concat(poem.original || []).join('\n').toLowerCase();
      }
      function relevance(poem, q) {
        if (!q) return 0;
        var query = q.toLowerCase();
        var score = 0;
        if (String(poem.title).toLowerCase() === query) score += 120;
        else if (String(poem.title).toLowerCase().indexOf(query) >= 0) score += 70;
        if (String(poem.author).toLowerCase().indexOf(query) >= 0) score += 45;
        if (String(poem.chapter).toLowerCase().indexOf(query) >= 0 || String(poem.chapterNumber) === query) score += 40;
        if (String(poem.type).toLowerCase().indexOf(query) >= 0) score += 30;
        (poem.original || []).forEach(function (line) { if (String(line).toLowerCase().indexOf(query) >= 0) score += 12; });
        return score;
      }
      function excerptFor(poem, q) {
        var lines = poem.original || [];
        if (q) {
          var query = q.toLowerCase();
          var match = lines.find(function (line) { return String(line).toLowerCase().indexOf(query) >= 0; });
          if (match) return match;
        }
        return poem.pullquote || lines.slice(0, 2).join('');
      }
      function button(label, value, group, active) {
        return '<button type="button" class="filter-button" data-filter="' + group + '" data-value="' + escapeHtml(value) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' + escapeHtml(label) + '</button>';
      }
      function renderFilters() {
        var authorHtml = button('全部', '', 'author', !state.author) + people.map(function (name) { return button(name, name, 'author', state.author === name); }).join('');
        var chapters = Array.from(new Set(poems.map(function (poem) { return poem.chapter; }).filter(Boolean))).sort(function (a,b) { return chapterNumber(a)-chapterNumber(b); });
        var chapterHtml = button('全部', '', 'chapter', !state.chapter) + chapters.map(function (name) { return button(name, name, 'chapter', state.chapter === name); }).join('');
        var genreHtml = button('全部', '', 'genre', !state.genre) + genres.map(function (name) { return button(name, name, 'genre', state.genre === name); }).join('');
        document.getElementById('author-filters').innerHTML = authorHtml;
        document.getElementById('chapter-filters').innerHTML = chapterHtml;
        document.getElementById('genre-filters').innerHTML = genreHtml;
        document.querySelectorAll('[data-quick-author]').forEach(function (chip) { chip.setAttribute('aria-pressed', String(state.author === chip.dataset.quickAuthor)); });
        document.querySelectorAll('[data-sort]').forEach(function (control) { control.setAttribute('aria-pressed', String(state.sort === control.dataset.sort)); });
      }
      function filteredPoems() {
        var q = state.q.trim().toLowerCase();
        var list = poems.filter(function (poem) {
          if (q && searchable(poem).indexOf(q) < 0) return false;
          if (state.author && String(poem.author).indexOf(state.author) < 0) return false;
          if (state.chapter && poem.chapter !== state.chapter) return false;
          if (state.genre && genreOf(poem.type) !== state.genre) return false;
          return true;
        });
        list.sort(function (a,b) {
          if (state.sort === 'chapter') return a.chapterNumber - b.chapterNumber || a.title.localeCompare(b.title, 'zh-CN');
          return relevance(b, state.q) - relevance(a, state.q) || a.chapterNumber - b.chapterNumber;
        });
        return list;
      }
      function resultCard(poem) {
        return '<a class="result-card" href="poem-detail.html?poem=' + encodeURIComponent(poem.id) + '">' +
          '<div class="result-top"><h3>' + highlight(poem.title, state.q) + '</h3><span class="genre-tag">' + escapeHtml(poem.type) + '</span></div>' +
          '<p class="result-meta">' + highlight(poem.author, state.q) + ' · ' + highlight(poem.chapter, state.q) + '</p>' +
          '<p class="result-excerpt">' + highlight(excerptFor(poem, state.q), state.q) + '</p>' +
          '<span class="result-more">读全文 <i data-lucide="arrow-right" aria-hidden="true"></i></span></a>';
      }
      function syncUrl() {
        var params = new URLSearchParams();
        if (state.q) params.set('q', state.q);
        if (state.author) params.set('author', state.author);
        if (state.chapter) params.set('chapter', state.chapter);
        if (state.genre) params.set('genre', state.genre);
        if (state.sort !== 'relevance') params.set('sort', state.sort);
        if (state.mode) params.set('mode', state.mode);
        history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash);
      }
      function render(sync) {
        var list = filteredPoems();
        renderFilters();
        resultCount.textContent = '共 ' + poems.length + ' 首 · 当前显示 ' + list.length + ' 首';
        if (!poems.length) {
          results.innerHTML = '<div class="empty-state"><i data-lucide="database-zap" aria-hidden="true"></i><h2>诗词数据未加载</h2><p>请确认 ../assets/poems-data.js 可访问。</p></div>';
        } else if (!list.length) {
          results.innerHTML = '<div class="empty-state"><i data-lucide="search-x" aria-hidden="true"></i><h2>未寻得相关诗词</h2><p>换一个词句，或清空当前筛选后再试。</p><button class="clear-button" id="clear-filters" type="button">清空筛选</button></div>';
          document.getElementById('clear-filters').addEventListener('click', clearAll);
        } else results.innerHTML = list.map(resultCard).join('');
        if (sync !== false) syncUrl();
        safeIcons();
      }
      function clearAll() {
        state.q = ''; state.author = ''; state.chapter = ''; state.genre = ''; state.sort = 'relevance'; state.mode = '';
        input.value = '';
        render(true);
        input.focus();
      }
      function readUrl() {
        var params = new URLSearchParams(location.search);
        state.q = params.get('q') || '';
        state.author = params.get('author') || '';
        state.chapter = params.get('chapter') || '';
        state.genre = params.get('genre') || '';
        state.sort = params.get('sort') === 'chapter' ? 'chapter' : 'relevance';
        state.mode = ['character','chapter','genre'].indexOf(params.get('mode')) >= 0 ? params.get('mode') : '';
        input.value = state.q;
      }
      form.addEventListener('submit', function (event) { event.preventDefault(); clearTimeout(debounceTimer); state.q = input.value.trim(); render(true); });
      input.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () { state.q = input.value.trim(); render(true); }, 300);
      });
      document.querySelector('.filters').addEventListener('click', function (event) {
        var control = event.target.closest('[data-filter]');
        if (!control) return;
        state[control.dataset.filter] = control.dataset.value;
        state.mode = '';
        render(true);
      });
      document.querySelector('.sort-group').addEventListener('click', function (event) {
        var control = event.target.closest('[data-sort]');
        if (!control) return;
        state.sort = control.dataset.sort;
        render(true);
      });
      document.getElementById('quick-people').addEventListener('click', function (event) {
        var control = event.target.closest('[data-quick-author]');
        if (!control) return;
        state.author = state.author === control.dataset.quickAuthor ? '' : control.dataset.quickAuthor;
        state.mode = '';
        render(true);
      });
      window.addEventListener('popstate', function () { readUrl(); render(false); });
      window.addEventListener('scroll', function () { backToTop.classList.toggle('visible', window.scrollY > 600); }, { passive: true });
      backToTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); });
      readUrl();
      render(false);
      if (state.mode) {
        var group = document.getElementById('filter-' + state.mode);
        if (group) { group.classList.add('mode-emphasis'); setTimeout(function () { group.classList.remove('mode-emphasis'); }, 1000); }
      }
    })();
  </script>
</body>
</html>
